    <script>
// ================================================================
// 直播控制（精确到秒）
// ================================================================

(function() {
    var wrapper = document.getElementById('liveWrapper');
    var iframe = document.getElementById('liveIframe');
    var placeholder = document.getElementById('livePlaceholder');
    var placeholderTitle = document.getElementById('placeholderTitle');
    var placeholderDesc = document.getElementById('placeholderDesc');
    
    function resize() { 
        var w = wrapper.clientWidth; 
        iframe.style.height = (w * 0.6) + 'px'; 
    }
    window.addEventListener('resize', resize);
    setTimeout(resize, 100);

    var liveStarted = false;

    // ═══════════════════════════════════════════════════════════════
    // 在这里修改开播和结束时间（24小时制，精确到秒）
    // ═══════════════════════════════════════════════════════════════
    var START_HOUR = 21;    // 开播小时
    var START_MIN = 32;     // 开播分钟
    var START_SEC = 50;      // 开播秒数（精确到秒）
    
    var END_HOUR = 21;      // 结束小时（次日）
    var END_MIN = 34;       // 结束分钟
    var END_SEC = 30;        // 结束秒数（精确到秒）
    // ═══════════════════════════════════════════════════════════════

    function checkShowLive() {
        var now = new Date();
        var totalSec = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();
        
        var startSec = START_HOUR * 3600 + START_MIN * 60 + START_SEC;
        var endSec = END_HOUR * 3600 + END_MIN * 60 + END_SEC;
        
        var isLiveTime = false;
        
        if (startSec > endSec) {
            // 跨天：例如 23:26:00 ~ 次日 21:35:00
            if (totalSec >= startSec || totalSec < endSec) {
                isLiveTime = true;
            }
        } else if (startSec < endSec) {
            // 不跨天：例如 21:33:00 ~ 21:35:00
            if (totalSec >= startSec && totalSec < endSec) {
                isLiveTime = true;
            }
        }
        // 如果 startSec === endSec，永远不显示

        if (isLiveTime) {
            iframe.style.display = 'block';
            placeholder.style.display = 'none';
            if (!liveStarted) {
                liveStarted = true;
                resize();
            }
        } else {
            iframe.style.display = 'none';
            placeholder.style.display = 'flex';
            
            if (liveStarted) {
                liveStarted = false;
                placeholderTitle.textContent = '🎰 搅珠直播';
                placeholderDesc.textContent = '开播时间为晚上 21:33（北京时间），敬请查看';
            } else {
                placeholderTitle.textContent = '🎰 搅珠直播';
                placeholderDesc.textContent = '开播时间为晚上 21:33（北京时间），敬请查看';
            }
        }
    }

    checkShowLive();
    // 每秒检查一次，实现秒级精确控制
    setInterval(checkShowLive, 1000);
})();
    </script>

<script>
// ================================================================
// 投注计算器核心逻辑
// ================================================================

const ZODIAC_COUNT = { '马': 5, '牛': 4, '虎': 4, '兔': 4, '龙': 4, '蛇': 4, '羊': 4, '猴': 4, '鸡': 4, '狗': 4, '猪': 4, '鼠': 4 };
const COMBO_MAP = { '二': 2, '三': 3, '四': 4, '五': 5 };

const ZODIAC_TO_NUMBERS = {
    '马': [1, 13, 25, 37, 49], '牛': [6, 18, 30, 42], '虎': [5, 17, 29, 41],
    '兔': [4, 16, 28, 40], '龙': [3, 15, 27, 39], '蛇': [2, 14, 26, 38],
    '羊': [12, 24, 36, 48], '猴': [11, 23, 35, 47], '鸡': [10, 22, 34, 46],
    '狗': [9, 21, 33, 45], '猪': [8, 20, 32, 44], '鼠': [7, 19, 31, 43]
};

const COLOR_TO_NUMBERS = {
    '红': [1, 2, 7, 8, 12, 13, 18, 19, 23, 24, 29, 30, 34, 35, 40, 45, 46],
    '绿': [5, 6, 11, 16, 17, 21, 22, 27, 28, 32, 33, 38, 39, 43, 44, 49],
    '蓝': [3, 4, 9, 10, 14, 15, 20, 25, 26, 31, 36, 37, 41, 42, 47, 48]
};

function getSpecialColorNumbers(type) {
    const colorMap = {
        '红': [1, 2, 7, 8, 12, 13, 18, 19, 23, 24, 29, 30, 34, 35, 40, 45, 46],
        '绿': [5, 6, 11, 16, 17, 21, 22, 27, 28, 32, 33, 38, 39, 43, 44, 49],
        '蓝': [3, 4, 9, 10, 14, 15, 20, 25, 26, 31, 36, 37, 41, 42, 47, 48]
    };
    const color = type.replace(/单|双/, '');
    const isOdd = type.includes('单');
    const numbers = colorMap[color] || [];
    return numbers.filter(n => (n % 2 === 1) === isOdd);
}

const ODD_NUMBERS = Array.from({ length: 25 }, (_, i) => i * 2 + 1);
const EVEN_NUMBERS = Array.from({ length: 24 }, (_, i) => (i + 1) * 2);
const BIG_NUMBERS = Array.from({ length: 25 }, (_, i) => i + 25);
const SMALL_NUMBERS = Array.from({ length: 24 }, (_, i) => i + 1);

function comb(n, k) {
    if (k < 0 || k > n) return 0;
    if (k === 0 || k === n) return 1;
    if (k > n - k) k = n - k;
    let r = 1;
    for (let i = 1; i <= k; i++) { r = r * (n - i + 1) / i; }
    return Math.round(r);
}

const ODDS = {
    'special': 47, 'zhengma': 7, 'pingte_zodiac': 2, 'pingte_zodiac_ma': 1.8,
    'pingte_tail': 1.8, 'pingte_tail_0': 2,
    'combo_zodiac_2': 4, 'combo_zodiac_2_ma': 3.5,
    'combo_zodiac_3': 10, 'combo_zodiac_3_ma': 9,
    'combo_zodiac_4': 30, 'combo_zodiac_4_ma': 28,
    'combo_zodiac_5': 100, 'combo_zodiac_5_ma': 80,
    'combo_tail_2': 3, 'combo_tail_3': 7, 'combo_tail_4': 15,
    'not_hit_5': 2,     // 五不中 2倍
    'not_hit_10': 4.5   // 十不中 4.5倍
};

// ================================================================
// 五不中 / 十不中 解析（支持各种符号）
// ================================================================

function parseNotHit(line) {
    // 匹配格式：各种符号分隔的数字 + 五不中/十不中 + 金额
    // 支持：. 、 ， , 空格 / - # 等
    const match = line.match(/^([\d.、，,。\s\/\-#]+)(五不中|十不中)\s*(\d+)$/);
    if (!match) return null;
    
    const numStr = match[1];
    const type = match[2];
    const amount = parseInt(match[3]);
    
    // 提取所有数字（支持各种分隔符）
    const nums = numStr.match(/\d+/g);
    if (!nums || nums.length === 0) return null;
    const numbers = nums.map(Number);
    
    const isFive = type === '五不中';
    const isTen = type === '十不中';
    
    // 验证数字个数
    if (isFive && numbers.length !== 5) {
        return {
            type: 'error',
            category: 'other',
            raw: line,
            display: '❌ 五不中需要5个数字，当前' + numbers.length + '个'
        };
    }
    if (isTen && numbers.length !== 10) {
        return {
            type: 'error',
            category: 'other',
            raw: line,
            display: '❌ 十不中需要10个数字，当前' + numbers.length + '个'
        };
    }
    
    const typeName = isFive ? '五不中' : '十不中';
    const displayText = numbers.join(',') + ' ' + typeName + ' ' + amount + '元 (全不中才赢)';
    
    return {
        type: isFive ? 'not_hit_5' : 'not_hit_10',
        category: 'special',
        numbers: numbers,
        amount: amount,
        unitPrice: amount,
        display: displayText,
        raw: line
    };
}

// ================================================================
// 五不中 / 十不中 中奖计算
// ================================================================

function calcNotHitWin(bet, result) {
    if (!result) return { winAmount: 0, detail: '无开奖结果' };
    
    const openCodes = result.codes || [];
    const allCodes = openCodes; // 全部7个号码（6平码+特码）
    const betNumbers = bet.numbers || [];
    const unitPrice = bet.unitPrice || bet.amount || 0;
    
    // 检查是否有任何一个投注数字出现在开奖号码中
    const hitNumbers = betNumbers.filter(num => allCodes.includes(num));
    const hitCount = hitNumbers.length;
    
    if (hitCount === 0) {
        // 全不中 → 中奖
        const isFive = bet.type === 'not_hit_5';
        const odds = isFive ? 2 : 4.5;
        const winAmount = unitPrice * odds;
        const typeName = isFive ? '五不中' : '十不中';
        return {
            winAmount: winAmount,
            detail: '✅ 全不中！' + betNumbers.join(',') + ' 均未开出 → ' + unitPrice + '×' + odds + '倍=' + winAmount + '元'
        };
    } else {
        // 有数字中了 → 输
        const typeName = bet.type === 'not_hit_5' ? '五不中' : '十不中';
        return {
            winAmount: 0,
            detail: '❌ 命中 ' + hitNumbers.join(',') + ' (' + hitCount + '个) → 不中'
        };
    }
}

// ================================================================
// 二中二 / 三中三 解析
// ================================================================

function parseErSan(line) {
    // 匹配格式：
    // 单式：二中二1.2/100 或 三中三1.2.3/100
    // 复式：二中二1.2.3各100 或 三中三1.2.3.4各100
    // 复式（带前缀）：复式二中二1.2.3各100 或 复式三中三1.2.3.4各100
    const match = line.match(/^(复式)?(二中二|三中三)\s*([\d.、，,\s\-]+?)(?:各|\/)\s*(\d+)$/);
    if (!match) return null;
    
    const hasFuShi = match[1] !== undefined;
    const type = match[2];
    const numStr = match[3];
    const separator = line.includes('各') ? '各' : '/';
    const amount = parseInt(match[4]);
    
    // 提取所有数字
    const nums = numStr.match(/\d+/g);
    if (!nums || nums.length === 0) return null;
    const numbers = nums.map(Number);
    
    const n = type === '二中二' ? 2 : 3;
    
    // 判断单式/复式
    let isSingle = false;
    let isMultiple = false;
    
    // 1. 有"复式"前缀 → 必须是复式，数字个数必须 > n
    if (hasFuShi) {
        if (numbers.length <= n) {
            // 复式前缀但数字不够 → 返回错误对象
            return {
                type: 'error',
                category: 'other',
                raw: line,
                display: '❌ 复式' + type + '需要至少' + (n + 1) + '个数字，当前' + numbers.length + '个'
            };
        }
        if (separator !== '各') {
            return {
                type: 'error',
                category: 'other',
                raw: line,
                display: '❌ 复式必须用"各"分隔金额'
            };
        }
        isMultiple = true;
    } else {
        // 2. 无"复式"前缀
        if (numbers.length === n) {
            // 单式
            if (separator !== '/') {
                return {
                    type: 'error',
                    category: 'other',
                    raw: line,
                    display: '❌ 单式' + type + '必须用"/"分隔金额'
                };
            }
            isSingle = true;
        } else if (numbers.length > n) {
            // 复式
            if (separator !== '各') {
                return {
                    type: 'error',
                    category: 'other',
                    raw: line,
                    display: '❌ 复式' + type + '必须用"各"分隔金额'
                };
            }
            isMultiple = true;
        } else {
            // 数字不够
            return {
                type: 'error',
                category: 'other',
                raw: line,
                display: '❌ ' + type + '需要至少' + n + '个数字，当前' + numbers.length + '个'
            };
        }
    }
    
// 计算总投注额
let totalAmount = amount;
if (isMultiple) {
    const totalGroups = comb(numbers.length, n);
    totalAmount = totalGroups * amount;  // 总投注额 = 组合数 × 单组金额
}

// 构建 display
let displayText = '';
if (isSingle) {
    displayText = '单式 ' + type + ' ' + numbers.join(',') + ' ' + separator + amount + '元 (必须全中)';
} else {
    const totalGroups = comb(numbers.length, n);
    displayText = type + numbers.join(',') + '各' + amount + '，共' + totalGroups + '组×' + amount + '元=' + totalAmount + '元';
}

return {
    type: type === '二中二' ? 'erzhonger' : 'sanzhongsan',
    category: 'other',
numbers: numbers, 
    amount: totalAmount,
    unitAmount: amount,

function calcErSanWin(bet, result) {
    if (!result) return { winAmount: 0, detail: '无开奖结果' };
    
    const openCodes = result.codes || [];
    const pingMa = openCodes.slice(0, 6);
    const numbers = bet.numbers || [];
    const n = bet.n || 2;
    const odds = n === 2 ? 60 : 600;
    const unitAmount = bet.unitAmount || bet.amount || 0;  // 单组金额
    
    const hitNumbers = numbers.filter(num => pingMa.includes(num));
    const hitCount = hitNumbers.length;
    
    if (bet.isSingle) {
        if (hitCount === n) {
            const win = unitAmount * odds;  // 单式：单组金额 × 赔率
            return { 
                winAmount: win, 
                detail: '全部命中 ' + hitNumbers.join(',') + ' → ' + unitAmount + '×' + odds + '倍=' + win
            };
        } else {
            return { 
                winAmount: 0, 
                detail: '未中奖(匹配' + hitCount + '/' + n + '个)'
            };
        }
    }
    
    if (bet.isMultiple) {
        if (hitCount >= n) {
            const groups = comb(hitCount, n);
            const win = groups * unitAmount * odds;  // 复式：命中组数 × 单组金额 × 赔率
            return { 
                winAmount: win, 
                detail: '命中' + hitCount + '个 (' + hitNumbers.join(',') + ') → C(' + hitCount + ',' + n + ')=' + groups + '组 × ' + unitAmount + '×' + odds + '倍=' + win
            };
        } else {
            return { 
                winAmount: 0, 
                detail: '未中奖(匹配' + hitCount + '个)'
            };
        }
    }
    
    return { winAmount: 0, detail: '未知类型' };
}

function parseCombo(line) {
    let comboList = [];
    const comboRegex = /([二三四五])(?:连|有|友)/g;
    let cm;
    while ((cm = comboRegex.exec(line)) !== null) {
        const k = COMBO_MAP[cm[1]];
        if (k && !comboList.includes(k)) comboList.push(k);
    }
    const chars = line.match(/[二三四五]/g);
    if (chars) {
        for (const ch of chars) {
            const k = COMBO_MAP[ch];
            if (k && !comboList.includes(k)) comboList.push(k);
        }
    }
    if (comboList.length === 0) return null;

    let amtStr = '';
    const amtMatch = line.match(/(\d+)$/);
    if (amtMatch) { amtStr = amtMatch[1]; }

    let items = [];
    let itemType = '';
    const zodiacItems = line.match(/[鼠牛虎兔龙蛇马羊猴鸡狗猪]/g);
    if (zodiacItems && zodiacItems.length > 0) {
        items = zodiacItems;
        itemType = '生肖';
    } else {
        let tailMatch = line.match(/(\d+)尾/);
        if (!tailMatch) { tailMatch = line.match(/尾(\d+)/); }
        if (tailMatch) {
            let tailStr = tailMatch[1];
            if (amtStr && tailStr.endsWith(amtStr) && tailStr.length > amtStr.length) {
                tailStr = tailStr.slice(0, -amtStr.length);
            }
            if (tailStr.length > 0) {
                items = tailStr.split('').map(Number);
                itemType = '尾数';
            }
        }
    }
    if (items.length === 0) return null;

    const n = items.length;
    let unitPrice = 1;
    if (amtStr) { unitPrice = parseInt(amtStr); }
    const validCombos = comboList.filter(k => k <= n);
    if (validCombos.length === 0) return null;

    let totalGroups = 0;
    let detailParts = [];
    for (const k of validCombos) {
        const c = comb(n, k);
        totalGroups += c;
        const name = ({ 2: '二', 3: '三', 4: '四', 5: '五' }[k]) + '连';
        detailParts.push(name + c + '组');
    }
    const totalAmount = totalGroups * unitPrice;
    const detailStr = detailParts.join(' + ');
    return {
        type: 'combo', category: 'other',
        items: items, itemType: itemType, comboList: validCombos,
        unitPrice: unitPrice, groups: totalGroups, amount: totalAmount,
        display: detailStr + '，共 ' + totalGroups + ' 组 × ' + unitPrice + '元 = ' + totalAmount + '元',
        raw: line
    };
}

function parseSpecial(line) {
    const match = line.match(/^(红单|红双|绿单|绿双|蓝单|蓝双|单|双|大|小|红|绿|蓝)(?:各|各数|各号|各码)?\s*(\d+)/);
    if (!match) return null;
    const type = match[1];
    const price = parseInt(match[2]);
    let items = [];
    let itemType = '';
    if (type === '单') { items = ODD_NUMBERS; itemType = '单双'; }
    else if (type === '双') { items = EVEN_NUMBERS; itemType = '单双'; }
    else if (type === '大') { items = BIG_NUMBERS; itemType = '大小'; }
    else if (type === '小') { items = SMALL_NUMBERS; itemType = '大小'; }
    else if (type === '红') { items = COLOR_TO_NUMBERS['红']; itemType = '颜色'; }
    else if (type === '绿') { items = COLOR_TO_NUMBERS['绿']; itemType = '颜色'; }
    else if (type === '蓝') { items = COLOR_TO_NUMBERS['蓝']; itemType = '颜色'; }
    else if (['红单', '红双', '绿单', '绿双', '蓝单', '蓝双'].includes(type)) {
        items = getSpecialColorNumbers(type);
        itemType = '颜色单双';
    }
    if (items.length === 0) return null;
    const total = items.length * price;
    return {
        type: 'expand', category: 'special',
        items: items, itemType: itemType, unitPrice: price,
        count: items.length, amount: total,
        display: '共 ' + items.length + ' 个号码 × ' + price + '元 = ' + total + '元',

        return calcNotHitWin(bet, result);
    }

    // 检测二中二/三中三
    if (bet.type === 'erzhonger' || bet.type === 'sanzhongsan') {
        return calcErSanWin(bet, result);
    }

    function countMatches(items, itemType) {
        let matchCount = 0;
        let matchedItems = [];
        if (itemType === '生肖') {
            const tradToSimp = { '馬': '马', '龍': '龙', '雞': '鸡', '豬': '猪', '鼠': '鼠', '牛': '牛', '虎': '虎', '兔': '兔', '蛇': '蛇', '羊': '羊', '猴': '猴', '狗': '狗' };
            for (const item of items) {
                let matched = false;
                for (const z of openZodiacs) {
                    const simZ = tradToSimp[z] || z;
                    const simItem = tradToSimp[item] || item;
                    if (simItem === simZ || item === z) { matched = true; break; }
                }
                if (matched) { matchCount++; matchedItems.push(item); }
            }
        } else if (itemType === '尾数') {
            for (const item of items) {
                for (const code of allCodes) {
                    if (code % 10 === item) { matchCount++; matchedItems.push(item); break; }
                }
            }
        } else {
            for (const code of allCodes) {
                if (items.includes(code)) { matchCount++; matchedItems.push(code); }
            }
        }
        return { count: matchCount, matchedItems: matchedItems };
    }

    const type = bet.type;
    let winAmount = 0;
    let detail = '';

    if (type === 'combo') {
        const items = bet.items || [];
        const itemType = bet.itemType || '';
        const comboList = bet.comboList || [];
        const unitPrice = bet.unitPrice || 1;
        const matchResult = countMatches(items, itemType);
        const m = matchResult.count;
        if (m < 2) { return { winAmount: 0, detail: '未中奖（匹配 ' + m + ' 个）' }; }

        let detailParts = [];
        let isZodiac = (itemType === '生肖');
        let isTail = (itemType === '尾数');
        const matchedItems = matchResult.matchedItems || [];
        const hasMaInMatch = matchedItems.some(item => item === '马' || item === '馬');

        for (const k of comboList) {
            const groups = comb(m, k);
            if (groups > 0) {
                let odds = 0;
                let partWin = 0;
                const name = ({ 2: '二', 3: '三', 4: '四', 5: '五' }[k]) + '连';
                if (isZodiac) {
                    let combosWithMa = 0;
                    let combosWithoutMa = 0;
                    if (hasMaInMatch && m >= 1) { combosWithMa = comb(m - 1, k - 1); }
                    combosWithoutMa = groups - combosWithMa;
                    let oddsWithMa, oddsWithoutMa;
                    if (k === 2) { oddsWithMa = 3.5; oddsWithoutMa = 4; }
                    else if (k === 3) { oddsWithMa = 9; oddsWithoutMa = 10; }
                    else if (k === 4) { oddsWithMa = 27; oddsWithoutMa = 30; }
                    else if (k === 5) { oddsWithMa = 80; oddsWithoutMa = 100; }
                    const winWithMa = combosWithMa * unitPrice * oddsWithMa;
                    const winWithoutMa = combosWithoutMa * unitPrice * oddsWithoutMa;
                    partWin = winWithMa + winWithoutMa;
                    winAmount += partWin;
                    let detailStr = '';
                    if (combosWithMa > 0 && combosWithoutMa > 0) {
                        detailStr = name + combosWithMa + '组×' + unitPrice + '×' + oddsWithMa + '倍=' + winWithMa + ' + ' + name + combosWithoutMa + '组×' + unitPrice + '×' + oddsWithoutMa + '倍=' + winWithoutMa;
                    } else if (combosWithMa > 0) {
                        detailStr = name + combosWithMa + '组×' + unitPrice + '×' + oddsWithMa + '倍=' + winWithMa;
                    } else {
                        detailStr = name + combosWithoutMa + '组×' + unitPrice + '×' + oddsWithoutMa + '倍=' + winWithoutMa;
                    }
                    detailParts.push(detailStr);
                } else if (isTail) {
                    if (k === 2) odds = ODDS['combo_tail_2'];
                    else if (k === 3) odds = ODDS['combo_tail_3'];
                    else if (k === 4) odds = ODDS['combo_tail_4'];
                    partWin = groups * unitPrice * odds;
                    winAmount += partWin;
                    detailParts.push(name + groups + '组×' + unitPrice + '×' + odds + '倍=' + partWin);
                }
            }
        }
        if (winAmount === 0) { return { winAmount: 0, detail: '未中奖（匹配 ' + m + ' 个）' }; }
        detail = detailParts.join(' + ');
        return { winAmount: Math.round(winAmount), detail: detail };
    }

    if (type === 'pingma') {
        const items = bet.items || [];
        const unitPrice = bet.unitPrice || 1;
        const pingMaCodes = allCodes.slice(0, 6);
        let hitCount = 0;
        let hitNumbers = [];
        for (const num of items) {
            if (pingMaCodes.includes(num)) { hitCount++; hitNumbers.push(num); }
        }
        if (hitCount === 0) { return { winAmount: 0, detail: '未中奖' }; }
        const totalWin = hitCount * unitPrice * 7;
        detail = hitNumbers.join('、') + ' 命中 ' + hitCount + ' 个 × ' + unitPrice + ' × 7倍 = ' + Math.round(totalWin);
        return { winAmount: Math.round(totalWin), detail: detail };
    } else if (type === 'pingte_zodiac') {
        const items = bet.items || [];
        const unitPrice = bet.unitPrice || 1;
        const openZodiacs = result.zodiacs || [];
        const tradToSimp = { '馬': '马', '龍': '龙', '雞': '鸡', '豬': '猪', '鼠': '鼠', '牛': '牛', '虎': '虎', '兔': '兔', '蛇': '蛇', '羊': '羊', '猴': '猴', '狗': '狗' };
        let hitCount = 0;
        let hitDetails = [];
        for (const item of items) {
            const simItem = tradToSimp[item] || item;
            let isHit = false;
            for (const z of openZodiacs) {
                const simZ = tradToSimp[z] || z;
                if (simItem === simZ || item === z) { isHit = true; break; }
            }
            if (isHit) {
                hitCount++;
                const hasMaFlag = (item === '马' || item === '馬');
                const odds = hasMaFlag ? ODDS['pingte_zodiac_ma'] : ODDS['pingte_zodiac'];
                const win = unitPrice * odds;
                hitDetails.push(item + '中' + win + '元');
                winAmount += win;
            }
        }
        if (hitCount === 0) { return { winAmount: 0, detail: '未中奖' }; }
        detail = hitDetails.join('；') + '，共' + Math.round(winAmount) + '元';
        return { winAmount: Math.round(winAmount), detail: detail };
    } else if (type === 'pingte_tail') {
        const items = bet.items || [];
        const unitPrice = bet.unitPrice || 1;
        const matchResult = countMatches(items, '尾数');
        const matchedCount = matchResult.count;
        if (matchedCount === 0) { return { winAmount: 0, detail: '未中奖' }; }
        const hasZeroTail = items.some(item => item === 0);
        const odds = hasZeroTail ? ODDS['pingte_tail_0'] : ODDS['pingte_tail'];
        winAmount = matchedCount * unitPrice * odds;
        detail = matchedCount + '个尾数 × ' + unitPrice + ' × ' + odds + '倍 = ' + Math.round(winAmount);
        return { winAmount: Math.round(winAmount), detail: detail };
    } else if (type === 'pingte_simple') {
        return { winAmount: 0, detail: '简单平特需指定号码/生肖/尾数' };
    } else if (type === 'expand') {
        const items = bet.items || [];
        const unitPrice = bet.unitPrice || 1;
        if (teMa === null) { return { winAmount: 0, detail: '无特码' }; }
        const hitCount = items.filter(n => n === teMa).length;
        if (hitCount > 0) {
            winAmount = hitCount * unitPrice * ODDS['special'];
            const priceParts = Array(hitCount).fill(unitPrice).join('+');
            detail = priceParts + '=' + hitCount * unitPrice + ' × 47倍 = ' + winAmount;
            return { winAmount: Math.round(winAmount), detail: detail };
        } else { return { winAmount: 0, detail: '特码' + teMa + '未命中' }; }
    } else { return { winAmount: 0, detail: '未知类型' }; }
}

let history = [];

function getWaterRate() {
    const input = document.getElementById('waterRate');
    return parseFloat(input.value) || 0;
}

function calcBets() {
    const input = document.getElementById('betInput');
    const rawLines = input.value.split('\n').filter(l => l.trim());

    const removeChars = ['特', '奥', '澳', '新', '新澳', '新奥', '特奥', '奥特', '元', '数', '米'];
    const cleanedLines = rawLines.map(line => {
        let newLine = line;
        for (const ch of removeChars) {
            newLine = newLine.replaceAll(ch, '');
        }
        return newLine.trim();
    }).filter(line => line !== '');

    const mergedLines = [];
    let pendingNumbers = [];

    for (let i = 0; i < cleanedLines.length; i++) {
        let line = cleanedLines[i].trim();

        line = line.replaceAll('号', '各');

        const isPureNumber = /^[\d，,、.\s]+$/.test(line);
        const hasGe = /各/.test(line);

        if (isPureNumber) {
            const nums = line.match(/\d+/g);
            if (nums && nums.length > 0) {
                pendingNumbers.push(...nums);
            }
        } else {
            if (pendingNumbers.length > 0 && hasGe) {
                let mergedLine = pendingNumbers.join('，') + '，' + line;
                mergedLine = mergedLine.replace(/各+/g, '各');
                mergedLines.push(mergedLine);
                pendingNumbers = [];
            } else {
                if (pendingNumbers.length > 0) {
                    mergedLines.push(pendingNumbers.join('，') + '（缺少各）');
                    pendingNumbers = [];
                }
                line = line.replace(/各+/g, '各');
                mergedLines.push(line);
            }
        }
    }

    if (pendingNumbers.length > 0) {
        mergedLines.push(pendingNumbers.join('，') + '（缺少各）');
    }

    const lines = mergedLines;
    history = [];
    let total = 0;
    const totalParts = [];
    let hasError = false;
    const result = getLotteryResult();

    for (const line of lines) {
        let cleanedLine = line.replace(/[、，,.\s。！？；;！?、…—·\t\n\r]+/g, '，');
        const bet = parseBet(cleanedLine);
        if (bet) {
            if (bet.type === 'error') {
                hasError = true;
                bet.winAmount = 0;
                bet.winDetail = '解析失败';
            } else {
                total += bet.amount;
                totalParts.push(String(bet.amount));
                const winResult = calcBetWin(bet, result);
                bet.winAmount = winResult.winAmount || 0;
                bet.winDetail = winResult.detail || '未中奖';
            }
            history.push(bet);
        }
    }

    const waterRate = getWaterRate() / 100;
    const shuiQian = total * waterRate;
    const shuiQianDisplay = shuiQian.toFixed(2);

    let specialWin = 0;
    let otherWin = 0;
    let totalWin = 0;
    const otherWinParts = [];
    const specialPriceParts = [];

    for (const bet of history) {
        if (bet.winAmount && bet.winAmount > 0) {
            totalWin += bet.winAmount;
            if (bet.category === 'special') {
                specialWin += bet.winAmount;
                const detail = bet.winDetail || '';
                const match = detail.match(/([\d\+]+)=(\d+) × 47倍 = (\d+)/);
                if (match) {
                    const pricePart = match[1];
                    const prices = pricePart.split('+').map(Number);
                    specialPriceParts.push(...prices);
                } else {
                    const price = bet.unitPrice || bet.amount || 0;
                    specialPriceParts.push(price);
                }
            } else {
                otherWin += bet.winAmount;
                otherWinParts.push(String(bet.winAmount));
            }
        }
    }

    const box = document.getElementById('resultBox');

    if (history.length === 0) {
        box.innerHTML = '<div class="empty-result">未识别到有效投注</div>';
    } else {
        let html = '';
        html += '<div>' + totalParts.join('+') + '=' + total + '</div>';
        html += '<div>' + total + '×' + (waterRate * 100).toFixed(1) + '%=' + shuiQianDisplay + '</div>';

        if (specialPriceParts.length > 0) {
            const priceStr = specialPriceParts.map((p, index) => index === 0 ? '特' + p : p).join('+');
            const totalSpecialBetAmount = specialPriceParts.reduce((sum, p) => sum + p, 0);
            html += '<div>' + priceStr + '=' + totalSpecialBetAmount + '×47倍=' + Math.round(specialWin) + '</div>';
        } else if (specialWin > 0) {
            html += '<div>特码中奖：' + Math.round(specialWin) + '</div>';
        } else {
            html += '<div>特码中奖：0</div>';
        }

        if (otherWin > 0) {
            const otherStr = otherWinParts.length > 0 ? otherWinParts.join('+') : String(otherWin);
            html += '<div>其他中奖：' + otherStr + '=' + Math.round(otherWin) + '</div>';
        } else {
            html += '<div>其他中奖：0</div>';
        }

        const profit = totalWin + shuiQian - total;
        const roundedProfit = Math.round(profit);
        const profitSign = roundedProfit >= 0 ? '' : '-';
        const profitLabel = roundedProfit >= 0 ? '赢' : '输';
        html += '<div>' + Math.round(totalWin) + '+' + shuiQianDisplay + '-' + total + '=' + profitSign + Math.abs(roundedProfit) + profitLabel + '</div>';

        if (hasError) {
            html += '<div class="error">⚠️ 部分投注未识别，请检查格式</div>';
        }

        html += '<button class="btn-secondary btn-sm" id="copyFormulaBtn" style="margin-top:8px; padding:4px 12px; border:1px solid #dce1e8; border-radius:6px;">📋 复制结果</button>';
        box.innerHTML = html;

        const copyBtn = document.getElementById('copyFormulaBtn');
        if (copyBtn) {
            copyBtn.addEventListener('click', function() {
                let lines = [];
                lines.push(totalParts.join('+') + '=' + total);
                lines.push(total + '×' + (waterRate * 100).toFixed(1) + '%=' + shuiQianDisplay);
                if (specialPriceParts.length > 0) {
                    const priceStr = specialPriceParts.map((p, index) => index === 0 ? '特' + p : p).join('+');
                    const totalSpecialBetAmount = specialPriceParts.reduce((sum, p) => sum + p, 0);
                    lines.push(priceStr + '=' + totalSpecialBetAmount + '×47倍=' + Math.round(specialWin));
                } else { lines.push('特码中奖：' + Math.round(specialWin)); }
                if (otherWin > 0) {
                    const otherStr = otherWinParts.length > 0 ? otherWinParts.join('+') : String(otherWin);
                    lines.push('其他中奖：' + otherStr + '=' + Math.round(otherWin));
                } else { lines.push('其他中奖：0'); }
                const profitLabel = roundedProfit >= 0 ? '赢' : '输';
                lines.push(Math.round(totalWin) + '+' + shuiQianDisplay + '-' + total + '=' + profitSign + Math.abs(roundedProfit) + profitLabel);
                navigator.clipboard.writeText(lines.join('\n')).then(() => {
                    this.textContent = '✅ 已复制';
                    setTimeout(() => this.textContent = '📋 复制结果', 1500);
                }).catch(() => {
                    const ta = document.createElement('textarea');
                    ta.value = lines.join('\n');
                    document.body.appendChild(ta);
                    ta.select();
                    document.execCommand('copy');
                    ta.remove();
                    this.textContent = '✅ 已复制';
                    setTimeout(() => this.textContent = '📋 复制结果', 1500);
                });
            });
        }
    }

    renderHistory();
    document.getElementById('countDisplay').textContent = '共 ' + history.length + ' 条';
    document.getElementById('timeDisplay').textContent = new Date().toLocaleTimeString();
    let resultLines = mergedLines.map(line => {
        if (/各/.test(line) && /^[\d，,.\s]+各\d+$/.test(line.replace(/\s/g, ''))) {
            return line.replace(/[、，,.\s。！？；;！?、…—·\t\n\r]+/g, '，');
        }
        return line;
    });
    input.value = resultLines.join('\n');
    autoResizeInput();
}

function renderHistory() {
    const c = document.getElementById('historyList');
    if (history.length === 0) {
        c.innerHTML = '<div class="empty-history">暂无记录</div>';
        return;
    }
    let html = '';
    for (const item of history) {
        if (item.type === 'error') {
            html += '<div class="history-item error-item"><div class="h-text h-error">' + item.raw + '</div><div class="h-detail h-error">❌ 未识别</div></div>';
        } else {
            const winAmount = item.winAmount || 0;
            const winDetail = item.winDetail || '未中奖';
            const winClass = winAmount > 0 ? 'h-win' : 'h-lose';
            const winText = winAmount > 0 ? '✅ 中奖 ' + Math.round(winAmount) + '元 (' + winDetail + ')' : '❌ ' + winDetail;
            html += '<div class="history-item"><div class="h-text">' + item.raw + '</div><div class="h-detail">' + item.display + '</div><div class="' + winClass + '">' + winText + '</div></div>';
        }
    }
    c.innerHTML = html;
}

function clearAll() {
    history = [];
    document.getElementById('resultBox').innerHTML = '<div class="empty-result">已清空</div>';
    document.getElementById('historyList').innerHTML = '<div class="empty-history">暂无记录</div>';
    document.getElementById('betInput').value = '';
    document.getElementById('countDisplay').textContent = '共 0 条';
    document.getElementById('timeDisplay').textContent = '';
    autoResizeInput();
}

function autoResizeInput() {
    const el = document.getElementById('betInput');
    el.style.height = 'auto';
    el.style.height = el.scrollHeight + 'px';
}

function pasteAndAppend() {
    // 方式1：调用 Android 原生桥接（APK 专用）
    if (window.jsAndroidBridge && window.jsAndroidBridge.getClipboardText) {
        try {
            var text = window.jsAndroidBridge.getClipboardText();
            if (text && text.trim()) {
                appendToInput(text.trim());
                return;
            }
        } catch (e) {}
    }

    // 方式2：旧版桥接名称兼容
    if (window.AndroidClipboard && window.AndroidClipboard.getText) {
        try {
            var text = window.AndroidClipboard.getText();
            if (text && text.trim()) {
                appendToInput(text.trim());
                return;
            }
        } catch (e) {}
    }

    // 方式3：网页标准 API（仅部分浏览器生效）
    if (navigator.clipboard && navigator.clipboard.readText) {
        navigator.clipboard.readText()
            .then(function(text) {
                if (text && text.trim()) {
                    appendToInput(text.trim());
                }
            })
            .catch(function() {
                alert('无法读取剪贴板，请长按输入框手动粘贴');
            });
        return;
    }

    // 全部失败，提示用户
    alert('无法读取剪贴板，请长按输入框手动粘贴');
}

// 辅助函数：追加文本到输入框
function appendToInput(text) {
    var input = document.getElementById("betInput");
    var current = input.value;
    var separator = (current && current.trim() !== "") ? "\n" : "";
    input.value = current + separator + text;
    input.dispatchEvent(new Event("input"));
    input.scrollTop = input.scrollHeight;
    autoResizeInput();
}

const API_URL = 'https://macaumarksix.com/api/live2';
const CLEAR_HOUR = 21;
const CLEAR_MINUTE = 30;
const DRAW_HOUR = 21;
const DRAW_MINUTE = 33;

let lastPeriodCache = '';
let hasClearedForNewDraw = false;
let isPolling = false;
let isDrawTriggered = false;
let pollingTimer = null;
const RETRY_INTERVAL = 3000;

const lotteryDateEl = document.getElementById('lotteryDate');
const lotteryPeriodEl = document.getElementById('lotteryPeriod');
const lotteryNumbersEl = document.getElementById('lotteryNumbers');

function displayNumbersOneByOne(codes, waves, zodiacs, period, openTime) {
    const dateStr = openTime ? openTime.split(' ')[0] : '';
    lotteryDateEl.textContent = '📅 ' + dateStr;
    lotteryPeriodEl.textContent = period ? period.replace('2026', '') + '期' : '';
    lotteryNumbersEl.innerHTML = '';
    const items = [];

        items.push({ num: codes[i] || '--', zodiac: zodiacs[i] || '--', wave: waves[i] || 'blue', isSpecial: false });
    }
    items.push({ num: codes[6] || '--', zodiac: zodiacs[6] || '--', wave: waves[6] || 'blue', isSpecial: true });
    let index = 0;
    const interval = setInterval(function() {
        if (index >= items.length) { clearInterval(interval); calcBets(); return; }
        const item = items[index];
        if (item.isSpecial) {
            const label = document.createElement('div');
            label.className = 'special-label';
            label.textContent = '特码';
            lotteryNumbersEl.appendChild(label);
        }
        lotteryNumbersEl.appendChild(createNumberBox(item.num, item.zodiac, item.wave, false));
        index++;
    }, 350);
}

async function fetchAndDisplayLottery(force, skipAnimation) {
    if (force === undefined) force = false;
    if (skipAnimation === undefined) skipAnimation = false;
    try {
        const response = await fetch(API_URL);
        if (!response.ok) throw new Error('网络请求失败');
        const data = await response.json();
        if (!data || data.length === 0) throw new Error('未获取到数据');

        const item = data[0];
        const openCode = item.openCode || '';
        const wave = item.wave || '';
        const zodiac = item.zodiac || '';
        const period = item.expect || '';
        const openTime = item.openTime || '';

        const now = new Date();
        const currentTotalSec = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();
        const clearTime = CLEAR_HOUR * 3600 + CLEAR_MINUTE * 60;
        const drawTime = DRAW_HOUR * 3600 + DRAW_MINUTE * 60;

        if (currentTotalSec < clearTime) {
            if (openCode && openCode.trim() !== '') {
                const codes = openCode.split(',').map(function(s) { return parseInt(s.trim()); });
                const waves = wave.split(',').map(function(s) { return s.trim().toLowerCase(); });
                const zodiacs = zodiac.split(',').map(function(s) { return s.trim(); });
                if (codes.length >= 7) {
                    if (period !== lastPeriodCache || force) {
                        lastPeriodCache = period;
                        displayAllNumbers(codes, waves, zodiacs, period, openTime);
                        setLotteryResult({ codes: codes, waves: waves, zodiacs: zodiacs });
                        calcBets();
                    }
                    return true;
                }
            }
            renderPlaceholders();
            return false;
        }

        if (currentTotalSec >= clearTime && currentTotalSec < drawTime) {
            if (!hasClearedForNewDraw) {
                hasClearedForNewDraw = true;
                renderPlaceholders();
                lotteryDateEl.textContent = '📅 等待新期开奖...';
                lotteryPeriodEl.textContent = '——';
                setLotteryResult(null);
                calcBets();
            }
            return false;
        }

        if (currentTotalSec >= drawTime) {
            if (openCode && openCode.trim() !== '') {
                const codes = openCode.split(',').map(function(s) { return parseInt(s.trim()); });
                const waves = wave.split(',').map(function(s) { return s.trim().toLowerCase(); });
                const zodiacs = zodiac.split(',').map(function(s) { return s.trim(); });
                if (codes.length >= 7) {
                    if (period !== lastPeriodCache || force) {
                        lastPeriodCache = period;
                        if (skipAnimation || isDrawTriggered) {
                            displayAllNumbers(codes, waves, zodiacs, period, openTime);
                        } else {
                            displayNumbersOneByOne(codes, waves, zodiacs, period, openTime);
                        }
                        setLotteryResult({ codes: codes, waves: waves, zodiacs: zodiacs });
                        hasClearedForNewDraw = false;
                        isDrawTriggered = true;
                        calcBets();
                        if (pollingTimer) {
                            clearInterval(pollingTimer);
                            pollingTimer = null;
                            isPolling = false;
                            console.log('✅ 开奖完成，轮询已停止');
                        }
                        return true;
                    } else {
                        const isShowingPlaceholder = lotteryNumbersEl.querySelector('.placeholder') !== null;
                        if (isShowingPlaceholder) {
                            displayAllNumbers(codes, waves, zodiacs, period, openTime);
                            setLotteryResult({ codes: codes, waves: waves, zodiacs: zodiacs });
                            calcBets();
                        }
                        return true;
                    }
                }
            }
            return false;
        }
        return false;
    } catch (error) {
        console.error('获取开奖信息失败:', error);
        lotteryNumbersEl.innerHTML = '<div class="lottery-error">⚠️ 加载开奖信息失败：' + error.message + '</div>';
        return false;
    }
}

function startPolling() {
    if (isPolling) return;
    isPolling = true;
    console.log('🔄 开始轮询开奖数据...');
    if (pollingTimer) {
        clearInterval(pollingTimer);
        pollingTimer = null;
    }
    pollingTimer = setInterval(async function() {
        const success = await fetchAndDisplayLottery();
        if (isDrawTriggered && success) {
            clearInterval(pollingTimer);
            pollingTimer = null;
            isPolling = false;
            console.log('✅ 开奖完成，轮询已停止');
        }
    }, RETRY_INTERVAL);
    fetchAndDisplayLottery().then(function(success) {
        if (isDrawTriggered && success) {
            clearInterval(pollingTimer);
            pollingTimer = null;
            isPolling = false;
            console.log('✅ 开奖完成，轮询已停止');
        }
    });
}

function scheduler() {
    const now = new Date();
    const currentTotalSec = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();
    const clearTime = CLEAR_HOUR * 3600 + CLEAR_MINUTE * 60;
    const drawTime = DRAW_HOUR * 3600 + DRAW_MINUTE * 60;
    if (currentTotalSec < clearTime) {
        if (!window._lotteryLoaded) {
            fetchAndDisplayLottery();
            window._lotteryLoaded = true;
        }
        return;
    }
    if (currentTotalSec >= clearTime && currentTotalSec < drawTime) {
        if (!isPolling && !isDrawTriggered) { startPolling(); }
        return;
    }
    if (currentTotalSec >= drawTime) {
        if (!isDrawTriggered) { if (!isPolling) { startPolling(); } }
    }
}

window.onload = function() {
    const lotteryRefreshBtn = document.getElementById('refreshLotteryBtn');
    if (lotteryRefreshBtn) {
        lotteryRefreshBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            this.innerHTML = '<div class="refresh-icon">⏳</div><div class="refresh-text">加载</div>';
            this.style.opacity = '0.6';
            this.style.pointerEvents = 'none';
            fetchAndDisplayLottery(true, true).finally(function() {
                lotteryRefreshBtn.innerHTML = '<div class="refresh-icon">🔄</div><div class="refresh-text">刷新</div>';
                lotteryRefreshBtn.style.opacity = '1';
                lotteryRefreshBtn.style.pointerEvents = 'auto';
            });
        });
    }

    document.getElementById('pasteBtn').addEventListener('click', pasteAndAppend);
    const betInput = document.getElementById('betInput');
    betInput.addEventListener('input', function() {
        autoResizeInput();
        calcBets();
    });
    document.getElementById('waterRate').addEventListener('input', function() {
        calcBets();
    });

    autoResizeInput();
    renderPlaceholders();
    setInterval(scheduler, 1000);
    scheduler();

    console.log('✅ 投注计算器已启动');
    console.log('📺 直播控制: 21:33 显示，21:35 结束');
};

window.refreshLottery = fetchAndDisplayLottery;
</script>
